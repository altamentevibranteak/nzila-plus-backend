<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samorai Logistics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex justify-center italic">

    <div class="w-full max-w-md bg-slate-800 shadow-2xl min-h-screen flex flex-col border-x border-slate-700">
        
        <header class="p-6 bg-yellow-500 text-slate-900 rounded-b-3xl shadow-lg">
            <div class="flex justify-between items-center">
                <h1 class="text-2xl font-black tracking-tighter italic">SAMORAI</h1>
                <i data-lucide="truck" class="w-8 h-8"></i>
            </div>
            <p class="text-sm font-bold opacity-80 mt-1">Gestão de Cargas v1.0</p>
        </header>

        <div id="api-status" class="mx-6 mt-4 p-2 rounded-full bg-slate-700 text-[10px] text-center uppercase tracking-widest font-bold text-slate-400">
            📡 Verificando Ngrok...
        </div>

        <main class="flex-1 p-6 space-y-4 overflow-y-auto">
            <h2 class="text-lg font-bold flex items-center gap-2">
                <i data-lucide="list"></i> Cargas Disponíveis
            </h2>
            
            <div id="lista-cargas" class="space-y-4">
                <div class="animate-pulse flex space-x-4 bg-slate-700/50 p-4 rounded-xl">
                    <div class="flex-1 space-y-4 py-1">
                        <div class="h-4 bg-slate-600 rounded w-3/4"></div>
                        <div class="h-4 bg-slate-600 rounded w-1/2"></div>
                    </div>
                </div>
            </div>
        </main>

        <nav class="p-4 border-t border-slate-700 bg-slate-800 flex justify-around text-slate-400">
            <button class="flex flex-col items-center text-yellow-500"><i data-lucide="home"></i><span class="text-[10px]">Início</span></button>
            <button class="flex flex-col items-center"><i data-lucide="navigation"></i><span class="text-[10px]">Rotas</span></button>
            <button class="flex flex-col items-center"><i data-lucide="user"></i><span class="text-[10px]">Perfil</span></button>
        </nav>
    </div>

    <script>
    // 1. URL DO TEU NGROK (Garante que está correta)
    const API_URL = "https://unsyndicated-sharyl-unrequisite.ngrok-free.dev/api/cargas";

    // 2. HEADERS COM O PULO DO GATO PARA O NGROK
    const headers = { 
        "ngrok-skip-browser-warning": "69420", // Valor padrão para saltar o aviso
        "Content-Type": "application/json",
        "Accept": "application/json"
    };

    async function carregarCargas() {
        try {
            console.log("Tentando conectar em:", `${API_URL}/disponiveis/`);
            
            // IMPORTANTE: O segundo parâmetro do fetch é um objeto que CONTÉM os headers
            const res = await fetch(`${API_URL}/disponiveis/`, { 
                method: 'GET',
                headers: headers 
            });

            if (!res.ok) throw new Error(`Erro HTTP: ${res.status}`);

            const cargas = await res.json();
            console.log("Cargas recebidas:", cargas);
            
            const statusDiv = document.getElementById('api-status');
            statusDiv.innerHTML = "🟢 BACKEND OPERACIONAL (BRASIL-ANGOLA)";
            statusDiv.classList.replace('text-slate-400', 'text-green-400');

            let html = '';
            cargas.forEach(c => {
                html += `
                    <div class="bg-slate-700/50 border border-slate-600 p-4 rounded-2xl hover:border-yellow-500 transition-all shadow-sm">
                        <div class="flex justify-between items-start mb-2">
                            <span class="bg-yellow-500/10 text-yellow-500 text-[10px] font-bold px-2 py-1 rounded">ID #${c.id}</span>
                            <span class="text-slate-400 text-xs">${c.peso || '0'} kg</span>
                        </div>
                        <div class="mb-4">
                            <p class="text-xs text-slate-400 uppercase font-bold">Origem</p>
                            <p class="text-sm text-white">${c.origem}</p>
                            <div class="h-4 w-px bg-slate-600 my-1 ml-2"></div>
                            <p class="text-xs text-slate-400 uppercase font-bold">Destino</p>
                            <p class="text-sm text-white">${c.destino}</p>
                        </div>
                        <button onclick="aceitarCarga(${c.id})" class="w-full bg-yellow-500 hover:bg-yellow-600 text-slate-900 font-black py-3 rounded-xl transition-transform active:scale-95">
                            ACEITAR CARGA
                        </button>
                    </div>`;
            });
            document.getElementById('lista-cargas').innerHTML = html || '<p class="text-center text-slate-500 py-10">Nenhuma carga disponível no momento.</p>';
        } catch (err) {
            console.error("ERRO DETALHADO:", err);
            document.getElementById('api-status').innerHTML = "🔴 ERRO DE CONEXÃO (VER CONSOLE)";
            document.getElementById('api-status').classList.add('text-red-400');
        }
    }

    async function aceitarCarga(id) {
        if(confirm("Samorai, confirma a aceitação desta carga?")) {
            try {
                const res = await fetch(`${API_URL}/${id}/aceitar/`, { 
                    method: 'POST', 
                    headers: headers 
                });
                if(res.ok) {
                    alert("Carga atribuída com sucesso!");
                    carregarCargas();
                }
            } catch (e) {
                alert("Erro ao comunicar com o servidor.");
            }
        }
    }

    lucide.createIcons();
    carregarCargas();
    setInterval(carregarCargas, 15000);
</script>
</body>
</html>
